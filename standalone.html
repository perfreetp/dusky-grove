<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>三维断层地层剖切实验</title>
<style>
:root {
  color-scheme: light;
  --bg: #e8eef6;
  --card: rgba(255, 255, 255, 0.94);
  --ink: #102033;
  --muted: #607086;
  --line: #d9e3ef;
  --dark: #0f1f33;
  --cyan: #0891b2;
  --blue: #2563eb;
  --warm: #dc2626;
  --cool: #1d4ed8;
  --shadow: 0 18px 45px rgba(15, 31, 51, 0.13);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { margin: 0; min-height: 100%; }

body {
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% -10%, rgba(14, 165, 233, 0.20), transparent 34rem),
    radial-gradient(circle at 92% 0%, rgba(249, 115, 22, 0.13), transparent 30rem),
    var(--bg);
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}

button, input { font: inherit; }

.app {
  width: min(1540px, 100%);
  margin: 0 auto;
  padding: 16px 0 22px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 4px 2px 16px;
}

.topbar h1 {
  margin: 0;
  font-size: clamp(22px, 2.2vw, 34px);
  letter-spacing: 0.02em;
  line-height: 1.15;
}

.topbar p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.preset-pill {
  flex: 0 0 auto;
  padding: 10px 14px;
  border: 1px solid rgba(217, 119, 6, 0.28);
  border-radius: 999px;
  color: #92400e;
  background: rgba(254, 243, 199, 0.9);
  font-weight: 800;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(217, 119, 6, 0.12);
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(390px, 470px);
  gap: 16px;
  align-items: start;
}

.card {
  background: var(--card);
  border: 1px solid rgba(217, 227, 239, 0.95);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

.view-card {
  position: sticky;
  top: 14px;
  height: calc(100dvh - 112px);
  min-height: 590px;
  overflow: hidden;
  background: #eaf1f8;
}

#threeHost, #threeHost canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#threeHost canvas { touch-action: none; }

.view-overlay {
  position: absolute;
  z-index: 4;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  pointer-events: none;
}

.badge, .hint {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 12.5px;
  line-height: 1;
  backdrop-filter: blur(10px);
}

.badge {
  color: #f8fafc;
  background: rgba(15, 31, 51, 0.88);
  font-weight: 800;
}

.hint {
  color: #17324d;
  background: rgba(255, 255, 255, 0.76);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.view-card > .btn {
  position: absolute;
  z-index: 5;
  right: 14px;
  bottom: 14px;
}

.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.controls { padding: 16px; }

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  padding: 5px;
  border-radius: 13px;
  background: #eaf1f8;
}

.segmented button {
  min-height: 40px;
  border: 0;
  border-radius: 9px;
  color: #4b5d73;
  background: transparent;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.segmented button:hover { background: rgba(255,255,255,.72); }
.segmented button.active {
  color: #fff;
  background: linear-gradient(135deg, #0f1f33, #155e75);
  box-shadow: 0 8px 18px rgba(8, 145, 178, 0.25);
}

.control { display: block; margin-top: 16px; }

.control-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  font-size: 13.5px;
}

.control-label b { font-weight: 850; }
.control-label output {
  color: #0e7490;
  font-weight: 850;
  font-variant-numeric: tabular-nums;
}

#throwValue { color: #c2410c; }

input[type="range"] {
  width: 100%;
  height: 24px;
  margin: 0;
  cursor: pointer;
  accent-color: var(--cyan);
}

#throwSlider { accent-color: #ea580c; }

.button-row {
  display: grid;
  grid-template-columns: 1.15fr 1fr 0.85fr;
  gap: 8px;
  margin-top: 14px;
}

.btn {
  min-height: 39px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: #17324d;
  background: #fff;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
}

.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(15,31,51,.10); }
.btn:active { transform: translateY(0); }
.btn.primary {
  color: #fff;
  border-color: #0e7490;
  background: linear-gradient(135deg, #0891b2, #0e7490);
}
.btn.primary.playing {
  border-color: #b91c1c;
  background: linear-gradient(135deg, #ef4444, #b91c1c);
}
.btn.ghost {
  color: #f8fafc;
  border-color: rgba(255,255,255,.25);
  background: rgba(15,31,51,.76);
  backdrop-filter: blur(10px);
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 14px;
}

.stats div {
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(180deg, #f8fbfe, #eef5fb);
}

.stats span {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.stats strong {
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}

.explain {
  margin: 12px 0 0;
  padding: 11px 12px;
  border-left: 4px solid #0891b2;
  border-radius: 0 11px 11px 0;
  color: #42546a;
  background: #f0f9ff;
  font-size: 12.8px;
  line-height: 1.65;
}

.profile-card { padding: 15px; }

.profile-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.profile-head h2 { margin: 0; font-size: 17px; }

.legend {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 800;
  white-space: nowrap;
}

.colorbar {
  width: clamp(110px, 15vw, 168px);
  height: 11px;
  border-radius: 999px;
  border: 1px solid rgba(15,31,51,.12);
  background: linear-gradient(90deg, #142878 0%, #2563eb 24%, #7dd3fc 43%, #f8fafc 50%, #fde68a 58%, #f97316 78%, #991b1b 100%);
}

#profileWrap {
  position: relative;
  width: 100%;
  border-radius: 13px;
  overflow: hidden;
  border: 1px solid #cbd8e6;
  background: #f8fafc;
}

#profileCanvas {
  display: block;
  width: 100%;
  height: 360px;
  cursor: crosshair;
}

.tip {
  position: absolute;
  z-index: 10;
  min-width: 154px;
  padding: 9px 11px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 11px;
  color: #f8fafc;
  background: rgba(15, 23, 42, 0.93);
  box-shadow: 0 14px 34px rgba(2, 6, 23, .30);
  backdrop-filter: blur(9px);
  pointer-events: none;
  font-size: 12.5px;
}

.tip-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 18px;
  padding: 2px 0;
}

.tip-row span { color: #c7d2fe; font-weight: 700; }
.tip-row b { font-variant-numeric: tabular-nums; font-size: 13px; }
.tip .warm { color: #fca5a5; }
.tip .cool { color: #93c5fd; }

.footnote {
  margin: 10px 2px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

@media (max-width: 1050px) {
  .layout { grid-template-columns: 1fr; }
  .view-card {
    position: relative;
    top: auto;
    height: 64vh;
    min-height: 430px;
  }
}

@media (max-width: 560px) {
  body { padding-left: max(9px, env(safe-area-inset-left)); padding-right: max(9px, env(safe-area-inset-right)); }
  .app { padding-top: 10px; }
  .topbar { align-items: flex-start; flex-direction: column; gap: 10px; }
  .preset-pill { align-self: flex-start; }
  .button-row { grid-template-columns: 1fr 1fr; }
  .button-row .primary { grid-column: 1 / -1; }
  .stats { grid-template-columns: 1fr; }
  .view-card { min-height: 390px; }
  #profileCanvas { height: 310px; }
  .hint { display: none; }
}

</style>
<div class="app">
    <header class="topbar">
      <div>
        <h1>三维断层地层剖切实验</h1>
        <p>起伏层位 · 倾斜断层 · 振幅色带 · 走向/倾向剖面</p>
      </div>
      <div class="preset-pill" id="presetPill">预设：H3 临界错断</div>
    </header>

    <main class="layout">
      <section class="card view-card" id="viewCard">
        <div id="threeHost"></div>
        <div class="view-overlay">
          <span class="badge" id="modeBadge">倾向剖面 · X 固定</span>
          <span class="hint">拖动青色剖面/圆球移动；空白处旋转；滚轮缩放</span>
        </div>
        <button class="btn ghost" id="resetView" type="button">复位视角</button>
      </section>

      <aside class="side">
        <section class="card controls">
          <div class="segmented" role="group" aria-label="剖切方向">
            <button type="button" id="modeStrike">走向剖切（X 方向）</button>
            <button type="button" id="modeDip" class="active">倾向剖切（Y 方向）</button>
          </div>

          <label class="control">
            <span class="control-label">
              <b>剖切面位置</b>
              <output id="sliceValue">X = −2.80 km</output>
            </span>
            <input id="sliceSlider" type="range" min="-4.8" max="4.8" step="0.01" value="-2.8" />
          </label>

          <label class="control">
            <span class="control-label">
              <b>断层落差</b>
              <output id="throwValue">0.58 km</output>
            </span>
            <input id="throwSlider" type="range" min="0" max="2.2" step="0.01" value="0.58" />
          </label>

          <div class="button-row">
            <button class="btn primary" id="playBtn" type="button">▶ 自动推进</button>
            <button class="btn" id="alignBtn" type="button">跳到对齐位置</button>
            <button class="btn" id="presetBtn" type="button">恢复预设</button>
          </div>

          <div class="stats">
            <div><span>当前剖面错距</span><strong id="offsetReadout">0.58 km</strong></div>
            <div><span>可追踪层位</span><strong id="layerReadout">7 层</strong></div>
          </div>
          <p class="explain" id="modeExplain"></p>
        </section>

        <section class="card profile-card">
          <div class="profile-head">
            <h2>实时振幅剖面</h2>
            <div class="legend" aria-label="振幅色标：负振幅偏冷，正振幅偏暖">
              <span>负/冷</span>
              <i class="colorbar"></i>
              <span>正/暖</span>
            </div>
          </div>
          <div id="profileWrap">
            <canvas id="profileCanvas" width="880" height="560" aria-label="地层振幅剖面图，悬停查看深度和振幅"></canvas>
            <div id="hoverTip" class="tip" hidden></div>
          </div>
          <p class="footnote">金色虚线为预设临界错断层 H3；悬停剖面时仅显示该点层位深度与振幅。</p>
        </section>
      </aside>
    </main>
  </div>
